<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13px 'Segoe UI', 'Yu Gothic UI', sans-serif; user-select: none; color: #e6edf3; }
  #fan { position: absolute; left: 14px; bottom: 14px; width: 380px; height: 250px; }
  #fan.enter { animation: dock-in .2s cubic-bezier(.2, .9, .25, 1) both; }
  #fan.leave { animation: dock-out .16s ease-in both; }
  @keyframes dock-in { from { transform: translateY(110%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes dock-out { to { transform: translateY(110%); opacity: 0; } }
  img { -webkit-user-drag: none; user-select: none; pointer-events: none; } /* 画像そのものをドラッグしてしまわないように（カードをドラッグする） */
  .card { position: absolute; left: 0; bottom: 0; width: 150px; height: 112px; border-radius: 10px; border: 1px solid #2d3a44; background: #172027; box-shadow: 0 6px 18px rgba(0, 0, 0, .55); transform-origin: 0% 100%; cursor: pointer; transition: transform .22s cubic-bezier(.2, .8, .25, 1.1), box-shadow .15s; overflow: hidden; display: flex; flex-direction: column; animation: pop .22s ease both; }
  @keyframes pop { from { opacity: 0; transform: scale(.6) rotate(0); } }
  .card:hover { box-shadow: 0 10px 26px rgba(0, 0, 0, .7), 0 0 0 2px #38b57d; z-index: 99 !important; }
  .ico { flex: 1; display: grid; place-items: center; background: #1f2a32; font-size: 38px; min-height: 0; }
  .ico img { width: 56px; height: 56px; object-fit: contain; }
  .tt { padding: 6px 28px 6px 9px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: #172027; }
  .card.ghost { box-shadow: 0 14px 34px rgba(0, 0, 0, .75), 0 0 0 2px #38b57d; opacity: .95; will-change: transform; }
  .card.dragging { position: fixed; z-index: 9999 !important; transition: none; animation: none; opacity: .92; transform: rotate(-3deg) scale(1.05) !important; box-shadow: 0 14px 34px rgba(0, 0, 0, .75), 0 0 0 2px #38b57d; }
  .x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border: 0; border-radius: 50%; background: rgba(0, 0, 0, .55); color: #fff; cursor: pointer; line-height: 1; }
  .x:hover { background: #c2333d; }
  #banner { position: absolute; left: 14px; bottom: 268px; padding: 7px 13px; border-radius: 999px; background: #0c2a1e; color: #34f0a0; border: 2px solid #34f0a0; box-shadow: 0 6px 18px rgba(0, 0, 0, .5); font-weight: 700; max-width: 400px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: pop .25s ease both; }
  #empty { position: absolute; left: 14px; bottom: 14px; padding: 12px 16px; border-radius: 10px; background: #172027; border: 1px solid #2d3a44; box-shadow: 0 6px 18px rgba(0, 0, 0, .55); color: #94a2ae; }
</style>
<div id="fan"></div>
<script>
  const fan = document.getElementById('fan');
  const draw = (items, justStored) => {
    fan.innerHTML = '';
    document.getElementById('banner')?.remove();
    if (justStored) { const b = document.createElement('div'); b.id = 'banner'; b.textContent = `✔ 「${justStored}」をしまいました`; document.body.append(b); }
    if (!items.length) { fan.innerHTML = '<div id="empty">しまってあるウィンドウは、ありません（外に出したウィンドウの「しまう」で、ここに入ります）</div>'; return; }
    items.forEach((it, i) => {
      const n = items.length;
      const c = document.createElement('div');
      c.className = 'card';
      const step = Math.min(34, 220 / Math.max(1, n - 1)); // トランプのように、少しずつ扇状に広げる
      c.style.transform = `translate(${i * step}px, ${-i * Math.min(14, 90 / Math.max(1, n))}px) rotate(${(i - (n - 1) / 2) * 0}deg)`;
      c.style.zIndex = String(i);
      c.title = it.title;
      c.innerHTML = '<div class="ico"></div><div class="tt"></div><button class="x" title="閉じる（削除）">✕</button>';
      const ico = c.querySelector('.ico');
      if (it.icon) { const im = new Image(); im.src = it.icon; ico.append(im); } else ico.textContent = '🗂';
      c.querySelector('.tt').textContent = it.title;
      // ドラッグで取り出す: カードを、出したい場所（画面のどこでも）に運んで離すと、そこにウィンドウが開く。少ししか動かさなかったときは、クリックとして、しまう前の位置に出す
      let st = null;
      // ドラッグで取り出す: カードを、出したい場所（画面のどこでも）に運んで離すと、そこにウィンドウが開く。少ししか動かさなかったときは、クリックとして、しまう前の位置に出す。
      // 押した瞬間に、一覧のウィンドウを画面いっぱいに広げ（透明）、カードの複製（ghost）を、画面の位置から決めて動かす。広がる前に速く動かしても、ついてくる
      const place = () => {
        if (!st || !st.ghost || !st.last) return;
        st.raf = 0;
        const e = st.last;
        st.ghost.style.transform = `translate3d(${e.clientX - st.dx}px, ${e.clientY - st.dy}px, 0) rotate(-3deg) scale(1.05)`; // いまの画面（広げたあと）でのカーソルの位置から、押した位置のずれを引く
      };
      const schedule = () => { if (st && !st.raf) st.raf = requestAnimationFrame(place); };
      const startDrag = () => {
        st.started = true;
        const g = c.cloneNode(true);
        g.className = 'card ghost';
        g.style.cssText = 'position:fixed;left:0;top:0;bottom:auto;z-index:99999;pointer-events:none;transition:none;animation:none;transform:translate3d(-9999px,-9999px,0)';
        g.querySelector('.x')?.remove();
        document.body.append(g);
        st.ghost = g;
        c.style.visibility = 'hidden';
        schedule();
      };
      const onMove = (e) => {
        if (!st) return;
        st.last = e;
        if (!st.started && Math.hypot(e.screenX - st.sx, e.screenY - st.sy) >= 5) startDrag();
        if (st.started) schedule();
      };
      const cleanup = () => {
        document.removeEventListener('pointermove', onMove, true);
        document.removeEventListener('pointerup', onUp, true);
        document.removeEventListener('pointercancel', onCancel, true);
        document.removeEventListener('keydown', onKey, true);
      };
      const end = async (e, cancelled) => {
        cleanup();
        if (!st) return;
        const s = st; st = null;
        if (s.raf) cancelAnimationFrame(s.raf);
        s.ghost?.remove();
        c.style.visibility = '';
        if (s.started && !cancelled) window.dock.restore(it.id, { x: e.screenX, y: e.screenY });
        else if (!s.started && !cancelled) window.dock.restore(it.id);
        else window.dock.drag(false); // やめた: 一覧の大きさを戻す
      };
      const onUp = (e) => end(e, false);
      const onCancel = (e) => end(e, true);
      const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); end(e, true); } };
      c.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 || e.target.closest('.x')) return;
        e.preventDefault();
        const r = c.getBoundingClientRect();
        st = { sx: e.screenX, sy: e.screenY, dx: e.clientX - r.left, dy: e.clientY - r.top, started: false, last: e, origin: null, ghost: null, raf: 0 };
        const mine = st;
        window.dock.drag(true).then((o) => { if (st === mine) { mine.origin = o || { x: 0, y: 0 }; schedule(); } }); // 先に、画面いっぱいに広げておく
        document.addEventListener('pointermove', onMove, true);
        document.addEventListener('pointerup', onUp, true);
        document.addEventListener('pointercancel', onCancel, true);
        document.addEventListener('keydown', onKey, true);
      });
      c.addEventListener('auxclick', (e) => { if (e.button === 1) { e.preventDefault(); window.dock.close(it.id); } }); // ホイールクリックで削除
      fan.append(c);
    });
  };
  window.dock.list().then((r) => draw(r.items, r.justStored));
  window.dock.onList(draw);
  document.addEventListener('dragstart', (e) => e.preventDefault());
  window.dock.onAnim((k) => { fan.classList.remove('enter', 'leave'); void fan.offsetWidth; fan.classList.add(k); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { window.dock.drag(false); window.dock.hide(); } });
  // カーソルが一覧のウィンドウから出て、しばらくそのままなら、閉じる（ドラッグ中は閉じない）
  let leaveTimer = null;
  document.addEventListener('mouseleave', () => { /* 本体（main.js）が、カーソルの位置を見て、閉じる */ });
  document.addEventListener('mouseenter', () => clearTimeout(leaveTimer));
  document.addEventListener('mousedown', (e) => { if (e.target === document.body || e.target === document.documentElement) window.dock.hide(); });
</script>
