<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13px 'Segoe UI', 'Yu Gothic UI', sans-serif; user-select: none; color: #e6edf3; }
  #fan { position: absolute; left: 14px; bottom: 14px; width: 380px; height: 250px; }
  .card { position: absolute; left: 0; bottom: 0; width: 150px; height: 112px; border-radius: 10px; border: 1px solid #2d3a44; background: #172027; box-shadow: 0 6px 18px rgba(0, 0, 0, .55); transform-origin: 0% 100%; cursor: pointer; transition: transform .22s cubic-bezier(.2, .8, .25, 1.1), box-shadow .15s; overflow: hidden; display: flex; flex-direction: column; animation: pop .22s ease both; }
  @keyframes pop { from { opacity: 0; transform: scale(.6) rotate(0); } }
  .card:hover { box-shadow: 0 10px 26px rgba(0, 0, 0, .7), 0 0 0 2px #38b57d; z-index: 99 !important; }
  .ico { flex: 1; display: grid; place-items: center; background: #1f2a32; font-size: 38px; min-height: 0; }
  .ico img { width: 56px; height: 56px; object-fit: contain; }
  .tt { padding: 6px 28px 6px 9px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: #172027; }
  .x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border: 0; border-radius: 50%; background: rgba(0, 0, 0, .55); color: #fff; cursor: pointer; line-height: 1; }
  .x:hover { background: #c2333d; }
  #empty { position: absolute; left: 14px; bottom: 14px; padding: 12px 16px; border-radius: 10px; background: #172027; border: 1px solid #2d3a44; box-shadow: 0 6px 18px rgba(0, 0, 0, .55); color: #94a2ae; }
</style>
<div id="fan"></div>
<script>
  const fan = document.getElementById('fan');
  const draw = (items) => {
    fan.innerHTML = '';
    if (!items.length) { fan.innerHTML = '<div id="empty">しまってあるウィンドウは、ありません（外に出したウィンドウの「しまう」で、ここに入ります）</div>'; return; }
    items.forEach((it, i) => {
      const n = items.length;
      const c = document.createElement('div');
      c.className = 'card';
      const step = Math.min(34, 220 / Math.max(1, n - 1)); // トランプのように、少しずつ扇状に広げる
      c.style.transform = `translate(${i * step}px, ${-i * Math.min(14, 90 / Math.max(1, n))}px) rotate(${(i - (n - 1) / 2) * 0}deg)`;
      c.style.zIndex = String(i);
      c.title = it.title;
      c.innerHTML = '<div class="ico"></div><div class="tt"></div><button class="x" title="閉じる（削除）">✕</button>';
      const ico = c.querySelector('.ico');
      if (it.icon) { const im = new Image(); im.src = it.icon; ico.append(im); } else ico.textContent = '🗂';
      c.querySelector('.tt').textContent = it.title;
      c.addEventListener('click', (e) => { if (e.target.closest('.x')) { window.dock.close(it.id); return; } window.dock.restore(it.id); });
      c.addEventListener('auxclick', (e) => { if (e.button === 1) { e.preventDefault(); window.dock.close(it.id); } }); // ホイールクリックで削除
      fan.append(c);
    });
  };
  window.dock.list().then(draw);
  window.dock.onList(draw);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.dock.hide(); });
  document.addEventListener('mousedown', (e) => { if (e.target === document.body || e.target === document.documentElement) window.dock.hide(); });
</script>
