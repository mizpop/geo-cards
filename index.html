<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoChecker</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1c7f55">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GeoChecker">
</head>
<body>
  <!-- 起動中の表示（ログイン画面かアプリが出たら消える） -->
  <div id="boot" aria-hidden="true"><div class="brand brand-lg"><span class="brand-mark">🌍</span> GeoChecker</div><span class="spinner"></span></div>
  <!-- ログイン画面 -->
  <section id="login" class="login" hidden>
    <div class="login-box">
      <div class="brand brand-lg"><span class="brand-mark">🌍</span> GeoChecker</div>
      <form id="viewer-form" class="stack">
        <label class="field">
          <span>閲覧パスワード</span>
          <input type="password" id="viewer-pass" autocomplete="current-password" required>
        </label>
        <button class="btn btn-primary" type="submit">入る</button>
      </form>
      <form id="editor-form" class="stack" hidden>
        <label class="field">
          <span>メールアドレス</span>
          <input type="email" id="editor-email" autocomplete="username" required>
        </label>
        <label class="field">
          <span>パスワード</span>
          <input type="password" id="editor-pass" autocomplete="current-password" required>
        </label>
        <button class="btn btn-primary" type="submit">編集者としてログイン</button>
      </form>
      <p class="login-error" id="login-error" role="alert"></p>
      <button class="link-btn" id="toggle-login" type="button">編集者としてログイン</button>
    </div>
  </section>

  <!-- メイン -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="brand"><span class="brand-mark">🌍</span><span class="brand-text">GeoChecker</span></div>
      <nav class="tabs" id="tabs">
        <a href="#study" data-view="study" title="暗記カード" aria-label="暗記カード"><svg class="tab-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="8" width="14" height="12" rx="2"/><path d="M6.5 8V6a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-3"/></svg><span class="tab-label"><span class="tab-long">暗記カード</span><span class="tab-short">暗記</span></span></a>
        <a href="#quiz" data-view="quiz" title="クイズ" aria-label="クイズ"><svg class="tab-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg><span class="tab-label">クイズ</span></a>
        <a href="#map" data-view="map" title="地図" aria-label="地図"><svg class="tab-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span class="tab-label">地図</span></a>
        <a href="#manage" data-view="manage" title="カード" aria-label="カード"><svg class="tab-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg><span class="tab-label">カード</span></a>
        <a href="#compare" data-view="compare" title="比較" aria-label="比較"><svg class="tab-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 3 8l5 5M3 8h13M16 21l5-5-5-5M21 16H8"/></svg><span class="tab-label">比較</span></a>
        <a href="#lang" data-view="lang" title="言語" aria-label="言語"><svg class="tab-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h8M8 4v2M5.5 6c.5 3 2.5 5.5 5.5 7M10.5 6c-.5 3-3 6-6.5 7.5M12 20l4.5-10L21 20M13.5 17h6"/></svg><span class="tab-label">言語</span></a>
      </nav>
      <div class="user-area">
        <span class="user-label" id="user-label"></span>
        <button class="spot-trigger" id="search-btn" type="button" aria-label="検索" title="検索（Ctrl + F / Ctrl + K）">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span class="tab-long">検索</span><kbd class="tab-long">Ctrl+F</kbd>
        </button>
        <button class="icon-btn stats-btn" id="stats-btn" type="button" aria-label="学習記録" title="学習記録（今日の目標・連続日数・地域ごとの正答率）">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        </button>
        <button class="icon-btn sound-btn" id="sound-btn" type="button" aria-label="効果音をミュート" aria-pressed="false" title="効果音">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" fill-opacity=".15"/><g class="snd-on"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.4 5.6a9 9 0 0 1 0 12.8"/></g><g class="snd-off"><path d="m16 9 6 6"/><path d="m22 9-6 6"/></g></svg>
        </button>
        <button class="icon-btn" id="changelog-btn" type="button" aria-label="更新履歴" title="更新履歴">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>
        </button>
        <button class="icon-btn gear-btn" id="settings-btn" type="button" aria-label="設定" title="設定">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>
    <div class="demo-banner" id="demo-banner" hidden>
      <span class="tab-long">デモモード：Supabase が未設定のため、データはこのブラウザ内にだけ保存されます（js/config.js を設定すると切り替わります）</span><span class="tab-short">デモモード（このブラウザ内にだけ保存）</span>
    </div>
    <main id="view" class="view"></main>
  </div>

  <dialog id="spotlight" class="spotlight" aria-label="検索"></dialog>
  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" popover="manual"></div>

  <datalist id="country-list"></datalist>
  <datalist id="search-list"></datalist>

  <!-- 起動に失敗したとき（古いファイルのキャッシュが混ざった等）に真っ白にせず原因を表示 -->
  <script>
    (function () {
      function showBootError(msg) {
        if (window.__appBooted || document.getElementById('boot-error')) return;
        var d = document.createElement('div');
        d.id = 'boot-error';
        d.className = 'boot-error';
        d.innerHTML = '<h2>アプリを起動できませんでした</h2>' +
          '<p><b>Ctrl + Shift + R</b>（Mac は <b>⌘ + Shift + R</b>）で強制再読み込みしてください。<br>更新直後は、古いファイルがブラウザに残っていることがあります。</p>' +
          (msg ? '<pre></pre>' : '');
        if (msg) d.querySelector('pre').textContent = msg;
        document.body.appendChild(d);
      }
      window.__showBootError = showBootError;
      window.addEventListener('error', function (e) { if (!window.__appBooted) showBootError(e.message); });
      window.addEventListener('unhandledrejection', function (e) { if (!window.__appBooted) showBootError(String(e.reason && e.reason.message || e.reason)); });
      setTimeout(function () { showBootError('（応答なし: 読み込みがタイムアウトしました）'); }, 10000);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
  <script>
    // ホーム画面に追加してアプリのように使えるように（オフラインでも開ける）
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
