# Supabase 無料プランは 7 日間アクセスがないと一時停止するため、週 2 回アクセスして防ぐ
# リポジトリの Settings → Secrets and variables → Actions に
#   SUPABASE_URL / SUPABASE_KEY を登録してください（js/config.js と同じ値）
name: Supabase keepalive

on:
  schedule:
    - cron: '0 3 * * 1,4' # 毎週月・木 12:00 JST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl -fsS "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_KEY" -o /dev/null -w "auth: %{http_code}\n"
          curl -sS "$SUPABASE_URL/rest/v1/cards?select=id&limit=1" -H "apikey: $SUPABASE_KEY" -o /dev/null -w "rest: %{http_code}\n"
